---
- name: User
  become: true
  become_user: "{{ the_user }}"
  vars:
    agent_dir: ~/.pi/agent
  block:
    - name: Create config directory
      ansible.builtin.file:
        path: "{{ agent_dir }}"
        state: directory
        mode: '0700'

    - name: Create config file
      ansible.builtin.copy:
        content: |
          {{- item.value }}
        dest: "{{ agent_dir }}/{{ item.key }}"
        mode: '0600'
      loop: "{{ the_configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Get configs contents
      ansible.builtin.slurp: { src: "{{ agent_dir }}/{{ item.key }}" }
      register: pi_cli_settings
      failed_when: false
      loop: "{{ the_merge_configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Merge configs
      ansible.builtin.copy:
        content: "{{ final }}"
        dest: "{{ agent_dir }}/{{ item.key }}"
        mode: '0600'
      vars:
        original: "{{ pi_cli_settings.results[ix].content | default('', true) | b64decode | default('{}', true) | from_json }}"
        update: "{{ item.value | from_json }}"
        final: "{{ original | combine(update) | to_nice_json(indent=2) }}"
      loop: "{{ the_merge_configs | dict2items }}"
      loop_control:
        index_var: ix
        label: "{{ item.key }}"
