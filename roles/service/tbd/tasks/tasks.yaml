---
- name: Docker
  ansible.builtin.import_role: { name: docker }
  vars: { docker_users: ["{{ tbd_owner }}"] }

- name: Compose
  become: true
  become_user: "{{ tbd_owner }}"
  vars:
    compose_dir: "{{ tbd_compose_dir | default(bookshelf_const_compose_dir + '/tbd', true) }}"
    conf_dir: "{{ tbd_conf_dir }}"
    service_state: "{{ tbd_enabled | ternary('present', 'absent') }}"
  block:
    - name: Create compose directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop: ["{{ compose_dir }}", "{{ conf_dir }}"]

    - name: Create compose files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ compose_dir }}/{{ item }}"
        mode: '0600'
      loop:
        - ts-serve.json   # <- For the first 2 files order matters
        - compose.yaml
        - main.env
        - secret.env
      register: tbd_compose_files_result

    # MANAGE SERVICE STATE

    - name: Apply service state
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: "{{ service_state }}"
        remove_orphans: true
      register: tbd_service_state

    - name: Restart service
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: restarted
        remove_orphans: true
      when:
        - tbd_enabled and not tbd_service_state.changed
        - tbd_compose_files_result.results[0].changed

    - name: Create note
      ansible.builtin.import_role: { name: bookshelf-note }
      # noqa: var-naming[no-role-prefix]
      vars: { src: notes.md.j2, dest: tbd-service.md, present: "{{ tbd_enabled }}" }

- name: Mark done
  ansible.builtin.set_fact:
    tbd_done: true
