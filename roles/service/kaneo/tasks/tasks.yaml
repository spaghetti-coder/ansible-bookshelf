---
- name: Docker
  ansible.builtin.import_role: { name: docker }
  vars: { docker_users: ["{{ kaneo_owner }}"] }

- name: Compose
  become: true
  become_user: "{{ kaneo_owner }}"
  vars:
    compose_dir: "{{ kaneo_compose_dir | default(bookshelf_const_compose_dir + '/kaneo', true) }}"
    conf_dir: "{{ kaneo_conf_dir }}"
    service_state: "{{ kaneo_enabled | ternary('present', 'absent') }}"
  block:
    - name: Create compose directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop: ["{{ compose_dir }}", "{{ conf_dir }}"]

    - name: Create compose files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ compose_dir }}/{{ item }}"
        mode: '0600'
      loop:
        - ts-serve.json   # <- Must be first
        - compose.yaml
        - main.env
        - secret.env
      register: kaneo_compose_files_result

    - name: Apply service state
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: "{{ service_state }}"
        remove_orphans: true
      register: kaneo_service_state

    - name: Restart service
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: restarted
        remove_orphans: true
      when:
        - kaneo_enabled and not kaneo_service_state.changed
        - kaneo_tailscaled and kaneo_compose_files_result.results[0].changed

    - name: Create note
      ansible.builtin.import_role: { name: bookshelf-note }
      # noqa: var-naming[no-role-prefix]
      vars: { src: notes.md.j2, dest: kaneo-service.md, present: "{{ kaneo_enabled }}" }

- name: Mark done
  ansible.builtin.set_fact:
    kaneo_done: true
