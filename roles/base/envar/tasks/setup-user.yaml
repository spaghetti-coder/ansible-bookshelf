---
- name: User
  become: true
  become_user: "{{ the_user }}"
  block:
    - name: Setup user
      ansible.builtin.command:
        argv: ["{{ envar_path }}", 'setup']
      register: envar_setup_result
      changed_when:
        - envar_setup_result.rc == 0
        - envar_setup_result.stdout | lower == 'done'

    - name: Create configs
      ansible.builtin.copy:
        content: |
          {{- item.value }}
        dest: "{{ envar_user_dir }}/{{ item.key }}"
        mode: '0600'
      loop: "{{ the_configs | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
