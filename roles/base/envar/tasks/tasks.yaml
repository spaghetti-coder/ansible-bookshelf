---
- name: Bash
  ansible.builtin.import_role: { name: bash }

- name: Load install
  ansible.builtin.include_tasks:
    file: install.yaml
  when: not (envar_install_done | default(false))

- name: Load setup users
  ansible.builtin.include_tasks: { file: setup-user.yaml }
  vars:
    the_user: "{{ user_obj.key }}"
    the_configs: "{{ user_obj.value.config | default({}, true) }}"
  loop: "{{ envar_users | default({}, true) | dict2items }}"
  loop_control:
    loop_var: user_obj
    label: "{{ the_user }}"

- name: Mark dones
  ansible.builtin.set_fact:
    envar_install_done: true
    envar_users_done: "{{ (envar_users_done | default([])) + envar_users_todo }}"
